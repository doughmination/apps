# The one workflow for every app. Each push to main builds all four, signed
# with their own keys and sharing one version (appVersion in gradle.properties,
# plus the build number), and replaces the single rolling `latest` release with
# them. Pull requests only build and test. See docs/releasing.md.
name: Apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds from main replace the same release, so let them finish in order.
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      KEYS: ${{ github.workspace }}/../keys
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Every app gets the same version: appVersion.<build number>. Version
      # codes start at 1000, above anything released before the apps shared one.
      - name: Version
        run: |
          base=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VERSION_NAME=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Version $base.$GITHUB_RUN_NUMBER ($((1000 + GITHUB_RUN_NUMBER)))"

      - name: Restore signing keys
        env:
          PLURAL_KEYSTORE_BASE64: ${{ secrets.PLURAL_KEYSTORE_BASE64 }}
          INBOX_KEYSTORE_BASE64: ${{ secrets.INBOX_KEYSTORE_BASE64 }}
          INBOX_PASSWORD: ${{ secrets.INBOX_KEYSTORE_PASSWORD }}
          DEVICE_REPORTER_KEYSTORE_BASE64: ${{ secrets.DEVICE_REPORTER_KEYSTORE_BASE64 }}
          MANAGER_KEYSTORE_BASE64: ${{ secrets.MANAGER_KEYSTORE_BASE64 }}
          INBOX_GOOGLE_SERVICES_JSON: ${{ secrets.INBOX_GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p "$KEYS"
          missing=""
          restore() {
            if [ -n "$2" ]; then echo "$2" | base64 -d > "$KEYS/$1.p12"; else missing="$missing $1"; fi
          }
          restore plural "$PLURAL_KEYSTORE_BASE64"
          restore inbox "$INBOX_KEYSTORE_BASE64"
          restore device-reporter "$DEVICE_REPORTER_KEYSTORE_BASE64"
          restore manager "$MANAGER_KEYSTORE_BASE64"
          # Inbox reads its key through email/keystore.properties.
          if [ -f "$KEYS/inbox.p12" ]; then
            umask 077
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=inbox\nkeyPassword=%s\n' \
              "$KEYS/inbox.p12" "$INBOX_PASSWORD" "$INBOX_PASSWORD" > email/keystore.properties
          fi
          if [ -n "$INBOX_GOOGLE_SERVICES_JSON" ]; then
            echo "$INBOX_GOOGLE_SERVICES_JSON" | base64 -d > email/app/google-services.json
          fi
          # A published APK must carry its app's own key, or it won't install
          # over earlier builds; say so rather than ship the debug key.
          if [ "$PUBLISH" = true ] && [ -n "$missing" ]; then
            echo "::error::Signing secrets are missing for:$missing. See docs/releasing.md."
            exit 1
          fi

      - name: Build
        env:
          PLURAL_PASSWORD: ${{ secrets.PLURAL_STORE_PASSWORD }}
          INBOX_PASSWORD: ${{ secrets.INBOX_KEYSTORE_PASSWORD }}
          DEVICE_REPORTER_PASSWORD: ${{ secrets.DEVICE_REPORTER_STORE_PASSWORD }}
          DEVICE_REPORTER_ALIAS: ${{ secrets.DEVICE_REPORTER_KEY_ALIAS }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_STORE_PASSWORD }}
        run: bash .github/scripts/build-apps.sh dist

      # Fails on a badly signed APK, and prints each certificate so it can be
      # checked against docs/releasing.md.
      - name: Verify signatures
        if: env.PUBLISH == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in dist/*.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | grep "certificate SHA-256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: dist/
          if-no-files-found: error

      # One release, `latest`, always holding every app's newest build.
      - name: Publish the rolling release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          {
            echo "Every app, built from ${GITHUB_SHA::7} on main. All four are version **$VERSION_NAME**."
            echo
            echo "| App | Install |"
            echo "|---|---|"
            echo "| System | [system.apk]($base/system.apk) |"
            echo "| Inbox | [inbox.apk]($base/inbox.apk) |"
            echo "| Device Reporter | [device-reporter.apk]($base/device-reporter.apk) |"
            echo "| Doughmination Manager | [doughmination-manager.apk]($base/doughmination-manager.apk) |"
            echo
            echo "These links always point at the newest build. Each installs over any earlier build of that app."
          } > notes.md
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.apk dist/versions.json \
            --target "$GITHUB_SHA" \
            --title "Doughmination apps $VERSION_NAME" \
            --notes-file notes.md \
            --latest

  # Installs the System app on an emulator, walks its screens and screenshots
  # each one; fails if it won't install, launch, or show what it should.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apps
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/plural-smoke.sh dist/system.apk smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/
          if-no-files-found: warn

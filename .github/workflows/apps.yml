# The one workflow for every app. Each push to main builds all four, signed
# with their own keys and sharing one version (appVersion in gradle.properties,
# plus the build number), and replaces the single rolling `latest` release with
# them. Pull requests only build and test. See docs/releasing.md.
name: Apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds from main replace the same release, so let them finish in order.
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      KEYS: ${{ github.workspace }}/../keys
    steps:
      # Full history: the release notes are the commits since the last release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # This build's version: appVersion.<build number>. Only apps whose sources
      # changed are published with it (make-manifest.sh). Version
      # codes start at 1000, above anything released before the apps shared one.
      - name: Version
        run: |
          base=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "VERSION_NAME=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Version $base.$GITHUB_RUN_NUMBER ($((1000 + GITHUB_RUN_NUMBER)))"

      - name: Restore signing keys
        env:
          PLURAL_KEYSTORE_BASE64: ${{ secrets.PLURAL_KEYSTORE_BASE64 }}
          INBOX_KEYSTORE_BASE64: ${{ secrets.INBOX_KEYSTORE_BASE64 }}
          INBOX_PASSWORD: ${{ secrets.INBOX_KEYSTORE_PASSWORD }}
          DEVICE_REPORTER_KEYSTORE_BASE64: ${{ secrets.DEVICE_REPORTER_KEYSTORE_BASE64 }}
          MANAGER_KEYSTORE_BASE64: ${{ secrets.MANAGER_KEYSTORE_BASE64 }}
          INBOX_GOOGLE_SERVICES_JSON: ${{ secrets.INBOX_GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p "$KEYS"
          missing=""
          restore() {
            if [ -n "$2" ]; then echo "$2" | base64 -d > "$KEYS/$1.p12"; else missing="$missing $1"; fi
          }
          restore plural "$PLURAL_KEYSTORE_BASE64"
          restore inbox "$INBOX_KEYSTORE_BASE64"
          restore device-reporter "$DEVICE_REPORTER_KEYSTORE_BASE64"
          restore manager "$MANAGER_KEYSTORE_BASE64"
          # Inbox reads its key through email/keystore.properties.
          if [ -f "$KEYS/inbox.p12" ]; then
            umask 077
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=inbox\nkeyPassword=%s\n' \
              "$KEYS/inbox.p12" "$INBOX_PASSWORD" "$INBOX_PASSWORD" > email/keystore.properties
          fi
          if [ -n "$INBOX_GOOGLE_SERVICES_JSON" ]; then
            echo "$INBOX_GOOGLE_SERVICES_JSON" | base64 -d > email/app/google-services.json
          fi
          # A published APK must carry its app's own key, or it won't install
          # over earlier builds; say so rather than ship the debug key.
          if [ "$PUBLISH" = true ] && [ -n "$missing" ]; then
            echo "::error::Signing secrets are missing for:$missing. See docs/releasing.md."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build
        env:
          # A published APK must carry the certificate pinned in .github/apps.json.
          REQUIRE_PINNED_CERT: ${{ env.PUBLISH }}
          PLURAL_PASSWORD: ${{ secrets.PLURAL_STORE_PASSWORD }}
          INBOX_PASSWORD: ${{ secrets.INBOX_KEYSTORE_PASSWORD }}
          DEVICE_REPORTER_PASSWORD: ${{ secrets.DEVICE_REPORTER_STORE_PASSWORD }}
          DEVICE_REPORTER_ALIAS: ${{ secrets.DEVICE_REPORTER_KEY_ALIAS }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_STORE_PASSWORD }}
        run: bash .github/scripts/build-apps.sh dist

      # Fails on a badly signed APK, and prints each certificate so it can be
      # checked against docs/releasing.md.
      - name: Verify signatures
        if: env.PUBLISH == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in dist/*.apk; do
            echo "$apk"
            "$apksigner" verify --print-certs "$apk" | grep "certificate SHA-256"
          done

      # The Manager's manifest. Against the published one, so release notes
      # cover what changed since then and no app's version code goes backwards.
      - name: Manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -p manifest.json -O "$RUNNER_TEMP/previous-manifest.json" 2>/dev/null \
            || echo "No published manifest yet."
          bash .github/scripts/make-manifest.sh dist "$RUNNER_TEMP/previous-manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: dist/
          if-no-files-found: error

      # One release, `latest`, always holding every app's newest build.
      - name: Publish the rolling release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          # Each app's newest build, from the manifest: apps that didn't change
          # keep the version they had.
          {
            echo "The newest build of every app, as of ${GITHUB_SHA::7} on main."
            echo
            echo "| App | Version | Install | Changed in this build |"
            echo "|---|---|---|---|"
            jq -r --arg base "$base" --rawfile changed dist/publish.txt '.apps[] |
              (.latest.apkUrl | split("/") | last) as $f |
              "| \(.name) | \(.latest.versionName) | [\($f)](\($base)/\($f)) | \(if ($changed | split("\n") | index($f)) then "yes" else "" end) |"' \
              dist/manifest.json
            echo
            echo "These links always point at the newest build. Each installs over any earlier build of that app."
            echo "Doughmination Manager reads [manifest.json]($base/manifest.json) to find and verify them."
          } > notes.md
          cat notes.md
          mapfile -t changed < dist/publish.txt
          # Updated in place rather than deleted and recreated, so the links
          # never 404 between builds. Only changed apps' APKs are replaced.
          # manifest.json goes up last: until it does, the Manager still sees
          # the previous build, and a download that catches an APK mid-swap
          # fails its checksum and is retried.
          if gh release view latest > /dev/null 2>&1; then
            if [ ${#changed[@]} -gt 0 ]; then
              gh release upload latest "${changed[@]/#/dist/}" --clobber
            fi
            gh release upload latest dist/manifest.json --clobber
            # Raw build facts; the manifest replaced it.
            gh release delete-asset latest versions.json --yes 2>/dev/null || true
            git tag -f latest "$GITHUB_SHA"
            git push -f origin refs/tags/latest
            gh release edit latest --title "Doughmination apps" --notes-file notes.md --latest
          else
            gh release create latest dist/*.apk dist/manifest.json \
              --target "$GITHUB_SHA" \
              --title "Doughmination apps" \
              --notes-file notes.md \
              --latest
          fi

  # On an emulator: installs the System app and walks its screens, then has the
  # Manager download, verify and install an app from the rolling release.
  # Screenshots of each step are attached to the run.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apps
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # System app first (its own build), then the Manager installing Inbox
          # from the published release.
          script: |
            bash .github/scripts/plural-smoke.sh dist/system.apk smoke/system
            bash .github/scripts/manager-e2e.sh dist/doughmination-manager.apk smoke/manager

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/
          if-no-files-found: warn

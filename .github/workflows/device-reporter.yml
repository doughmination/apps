name: Device Reporter

on:
  push:
    branches: [main]
    tags: ["device-reporter-v*"]
    paths: &paths
      - "api-helper/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew*"
      - ".github/workflows/device-reporter.yml"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v2.1.0 (creates device-reporter-v2.1.0). Leave blank to just build."
        required: false
        type: string

concurrency:
  group: device-reporter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device-reporter:
    permissions:
      contents: write
    uses: ./.github/workflows/android-app.yml
    with:
      app: Device Reporter
      module: ":api-helper:app"
      module_dir: api-helper/app
      package_name: uk.doughmination.devicereporter
      artifact: device-reporter
      tag_prefix: device-reporter-v
      # v2.0.0 shipped as versionCode 2 from doughmination/api-helper; stay above it.
      version_code_base: 100
      dev_version_prefix: "2.0"
      signing: env
      release_version: ${{ inputs.version }}
    secrets:
      keystore_base64: ${{ secrets.DEVICE_REPORTER_KEYSTORE_BASE64 }}
      store_password: ${{ secrets.DEVICE_REPORTER_STORE_PASSWORD }}
      key_alias: ${{ secrets.DEVICE_REPORTER_KEY_ALIAS }}
      key_password: ${{ secrets.DEVICE_REPORTER_KEY_PASSWORD }}

# Builds, signs and publishes one app. Each app's own workflow (inbox.yml,
# device-reporter.yml, ...) decides when to run and calls this with its details.
# See docs/releasing.md for tags, version codes and signing.
name: Android app

on:
  workflow_call:
    inputs:
      app:
        description: Display name, used in release titles ("Inbox").
        type: string
        required: true
      module:
        description: Gradle path of the app module (":email:app").
        type: string
        required: true
      module_dir:
        description: Directory of that module ("email/app").
        type: string
        required: true
      package_name:
        description: applicationId, written into the release metadata.
        type: string
        required: true
      artifact:
        description: File name prefix for the APK ("inbox" -> inbox-1.2.0.apk).
        type: string
        required: true
      tag_prefix:
        description: Release tags look like <tag_prefix><version> ("inbox-v").
        type: string
        required: true
      version_code_base:
        description: Added to the run number so versionCode stays above every earlier build.
        type: number
        required: true
      dev_version_prefix:
        description: Untagged builds are named <prefix>.<versionCode>.
        type: string
        default: "1.0"
      signing:
        description: >
          How the app's Gradle build reads its key: "properties" writes
          <properties_dir>/keystore.properties, "env" sets SIGNING_* variables.
        type: string
        default: env
      properties_dir:
        type: string
        default: ""
      key_alias:
        description: Key alias, unless the key_alias secret is set.
        type: string
        default: ""
      google_services_path:
        description: Where google-services.json goes, if the secret is set.
        type: string
        default: ""
      rolling_tag:
        description: If set, every build from main replaces this release.
        type: string
        default: ""
      release_version:
        description: Manual release version ("v1.2.0"); creates the tag.
        type: string
        default: ""
    secrets:
      keystore_base64:
        required: false
      store_password:
        required: false
      key_alias:
        required: false
      key_password:
        required: false
      google_services_json:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_SIGNING_KEY: ${{ secrets.keystore_base64 != '' }}
      IS_TAG: ${{ startsWith(github.ref, format('refs/tags/{0}', inputs.tag_prefix)) }}
      IS_MANUAL_RELEASE: ${{ inputs.release_version != '' }}
      IS_ROLLING: ${{ inputs.rolling_tag != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for scoping release notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          REF_NAME: ${{ github.ref_name }}
          PREFIX: ${{ inputs.tag_prefix }}
          MANUAL: ${{ inputs.release_version }}
          BASE: ${{ inputs.version_code_base }}
          DEV_PREFIX: ${{ inputs.dev_version_prefix }}
          EVENT: ${{ github.event_name }}
        run: |
          code=$((BASE + GITHUB_RUN_NUMBER))
          if [ "$IS_TAG" = true ]; then
            name=${REF_NAME#"$PREFIX"}
            tag=$REF_NAME
          elif [ -n "$MANUAL" ]; then
            name=${MANUAL#v}
            tag="$PREFIX$name"
          elif [ "$EVENT" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            # Every build from main is released, named by its version code.
            name="$DEV_PREFIX.$code"
            tag="$PREFIX$name"
          else
            name="$DEV_PREFIX.$code"
            tag=""
          fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "versionCode $code, versionName $name ${tag:+(release $tag)}"

      # Anything published must be signed with the app's own key, or it can't
      # install over earlier builds; say so rather than quietly skipping.
      - name: Require signing key
        if: (env.RELEASE_TAG != '' || env.IS_ROLLING == 'true') && env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::The signing secrets for ${{ inputs.app }} aren't set on this repository, so no release can be built. See docs/releasing.md."
          exit 1

      # Pull requests from forks get no secrets, so they build unsigned (or
      # with the debug key, depending on the app).
      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.keystore_base64 }}
          STORE_PASSWORD: ${{ secrets.store_password }}
          KEY_ALIAS: ${{ secrets.key_alias || inputs.key_alias }}
          KEY_PASSWORD: ${{ secrets.key_password || secrets.store_password }}
          MODE: ${{ inputs.signing }}
          PROPS_DIR: ${{ inputs.properties_dir }}
        run: |
          store="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$store"
          if [ "$MODE" = properties ]; then
            umask 077
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$store" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$PROPS_DIR/keystore.properties"
          else
            {
              echo "SIGNING_STORE_FILE=$store"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.google_services_json }}
          DEST: ${{ inputs.google_services_path }}
        if: env.GOOGLE_SERVICES_JSON != '' && inputs.google_services_path != ''
        run: echo "$GOOGLE_SERVICES_JSON" | base64 -d > "$DEST"

      - name: Build
        run: ./gradlew "${{ inputs.module }}:assembleRelease" --console=plain

      - name: Name APK and write release metadata
        env:
          MODULE_DIR: ${{ inputs.module_dir }}
          ARTIFACT: ${{ inputs.artifact }}
          PACKAGE: ${{ inputs.package_name }}
        run: |
          mkdir -p dist
          src=$(ls "$MODULE_DIR"/build/outputs/apk/release/*.apk)
          apk="dist/$ARTIFACT-$VERSION_NAME.apk"
          meta="dist/$ARTIFACT-$VERSION_NAME.json"
          mv "$src" "$apk"
          # Read by whatever builds the Doughmination Manager manifest (docs/manifest.md).
          jq -n \
            --arg packageName "$PACKAGE" \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg file "$(basename "$apk")" \
            --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" \
            --argjson sizeBytes "$(stat -c %s "$apk")" \
            --arg commit "$GITHUB_SHA" \
            '{$packageName, $versionCode, $versionName, $file, $sha256, $sizeBytes, $commit}' > "$meta"
          cat "$meta"
          echo "APK=$apk" >> "$GITHUB_ENV"
          echo "META=$meta" >> "$GITHUB_ENV"

      # Fails if the APK isn't validly signed, and prints the certificate so it
      # can be checked against docs/releasing.md.
      - name: Verify signature
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-${{ env.VERSION_NAME }}
          path: dist/
          if-no-files-found: error

      - name: Publish release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.tag_prefix }}
          APP: ${{ inputs.app }}
        run: |
          # Notes cover this app's previous release onwards, not other apps' tags.
          prev=$(git tag -l "$PREFIX*" --sort=-v:refname | grep -vx "$RELEASE_TAG" | head -1 || true)
          gh release create "$RELEASE_TAG" "$APK" "$META" \
            --target "$GITHUB_SHA" \
            --title "$APP $VERSION_NAME" \
            --generate-notes ${prev:+--notes-start-tag "$prev"} \
            --latest=false

      # A rolling release that always holds the newest build from main.
      - name: Publish rolling release
        if: env.IS_ROLLING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING: ${{ inputs.rolling_tag }}
          APP: ${{ inputs.app }}
        run: |
          gh release delete "$ROLLING" --cleanup-tag --yes || true
          gh release create "$ROLLING" "$APK" "$META" \
            --target "$GITHUB_SHA" \
            --title "$APP latest build ($VERSION_NAME)" \
            --notes "Built from ${GITHUB_SHA::7} on main. Installs over any earlier build." \
            --latest=false
